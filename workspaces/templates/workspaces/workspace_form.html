{% extends "base.html" %}

{% block title %}Create a workspace · Project Management System{% endblock %}

{% block content %}
<div class="card mx-auto max-w-md">
  <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Create a workspace</h1>
  <p class="mt-2 text-muted">You will be the owner, and you can add members once it's created.</p>
  <form method="post" class="mt-6 space-y-5" novalidate>
    {% csrf_token %}
    {% include "partials/form_body.html" %}
    <div class="flex flex-col-reverse gap-3 pt-1 sm:flex-row">
      <a href="{% url 'core:dashboard' %}" class="btn-secondary sm:flex-none">Cancel</a>
      <button type="submit" class="btn-primary sm:flex-1">Create workspace</button>
    </div>
  </form>
</div>
{% endblock %}
