# Continuous integration (step 10): on every push, run the same checks we
# run locally, in CLAUDE.md's standard order: migration drift, system
# check, full test suite. Two jobs run in parallel, one per database, and
# the run passes only if both pass.
name: CI

# Triggers: a push to any branch ('**' leaves out tags), and pull requests
# into main.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the code. It uses no secrets.
permissions:
  contents: read

jobs:
  # PostgreSQL, through the real Dockerfile and compose.yaml, as locally.
  postgres:
    name: PostgreSQL (Docker Compose)
    runs-on: ubuntu-24.04        # runner image pinned, not ubuntu-latest
    timeout-minutes: 15          # a hang can't run for hours
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build the development image
        run: docker compose build

      # `run` starts db, waits for its health check, runs one command in a
      # fresh web container and returns its exit code. No dev server starts
      # and no port is published.
      - name: Migration drift
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run

      - name: System check
        run: docker compose run --rm web python manage.py check

      # --noinput: never stop to ask about an old test database.
      - name: Test suite
        run: docker compose run --rm web python manage.py test --noinput

      - name: Show database logs
        if: failure()
        run: docker compose logs db

      - name: Remove containers and the database volume
        if: always()
        run: docker compose down -v

  # SQLite, with Python directly on the runner, as in the host .venv.
  # No DJANGO_DB_* variables are set, so settings choose SQLite.
  sqlite:
    name: SQLite (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip               # reuse downloaded packages between runs

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: System check
        run: python manage.py check

      - name: Test suite
        run: python manage.py test --noinput
