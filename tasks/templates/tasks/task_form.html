{% extends "base.html" %}

{% block title %}New task · {{ project.name }} · {{ workspace.name }} · Project Management System{% endblock %}

{% block content %}
<div class="card mx-auto max-w-md">
  <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">New task</h1>
  <p class="mt-2 text-muted">in <span class="font-medium text-ink wrap-anywhere">{{ project.name }}</span> · <span class="wrap-anywhere">{{ workspace.name }}</span></p>
  <form method="post" class="mt-6 space-y-5" novalidate>
    {% csrf_token %}
    {% include "partials/form_body.html" %}
    <div class="flex flex-col-reverse gap-3 pt-1 sm:flex-row">
      <a href="{% url 'projects:detail' workspace.pk project.pk %}" class="btn-secondary sm:flex-none">Cancel</a>
      <button type="submit" class="btn-primary sm:flex-1">Create task</button>
    </div>
  </form>
</div>
{% endblock %}
