# Local production-image rehearsal only; HTTPS/static delivery are deferred.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Supply DJANGO_SECRET_KEY}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?Supply DJANGO_ALLOWED_HOSTS}"
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: "${DJANGO_DB_NAME:?Supply DJANGO_DB_NAME}"
      DJANGO_DB_USER: "${DJANGO_DB_USER:?Supply DJANGO_DB_USER}"
      DJANGO_DB_PASSWORD: "${DJANGO_DB_PASSWORD:?Supply DJANGO_DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17.11-trixie
    environment:
      POSTGRES_DB: "${DJANGO_DB_NAME:?Supply DJANGO_DB_NAME}"
      POSTGRES_USER: "${DJANGO_DB_USER:?Supply DJANGO_DB_USER}"
      POSTGRES_PASSWORD: "${DJANGO_DB_PASSWORD:?Supply DJANGO_DB_PASSWORD}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=en_US.utf8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15 
volumes:
  postgres-data: