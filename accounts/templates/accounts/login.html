{% extends "base.html" %}

{% block title %}Log in · Project Management System{% endblock %}

{% block content %}
<div class="card mx-auto max-w-md">
  <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Log in</h1>
  <p class="mt-2 text-muted">Welcome back. Sign in to see your workspaces.</p>
  <form method="post" class="mt-6 space-y-5" novalidate>
    {% csrf_token %}
    {% include "partials/form_body.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn-primary w-full">Log in</button>
  </form>
  <p class="mt-6 text-sm text-muted">New here? <a href="{% url 'accounts:register' %}" class="link">Create an account</a></p>
</div>
{% endblock %}
