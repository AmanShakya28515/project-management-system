{% extends "base.html" %}

{% block title %}Register · Project Management System{% endblock %}

{% block content %}
<div class="card mx-auto max-w-md">
  <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Create an account</h1>
  <p class="mt-2 text-muted">Set up your account to create and join workspaces.</p>
  <form method="post" class="mt-6 space-y-5" novalidate>
    {% csrf_token %}
    {% include "partials/form_body.html" %}
    <button type="submit" class="btn-primary w-full">Create account</button>
  </form>
  <p class="mt-6 text-sm text-muted">Already have an account? <a href="{% url 'accounts:login' %}" class="link">Log in</a></p>
</div>
{% endblock %}
