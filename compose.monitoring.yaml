# Monitoring (step 14): a separate Compose project beside the app, private
# like the app. Every published port is on the server's loopback; Grafana is
# reached through the SSH tunnel. Only project "pms" is collected.
# Run every command with:
#   docker compose -p pms-monitoring -f compose.monitoring.yaml \
#     --env-file <monitoring env file> ...
# On the server, use the helper /opt/pms/mon (see README).
name: pms-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"                # logs can't fill the shared disk
    max-file: "3"

services:
  # Dashboards. Login required; provisioned from monitoring/grafana.
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"      # loopback only: open through the tunnel
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Read only on Grafana's first start (a fresh grafana-data volume).
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Supply GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Nothing phones home from the shared server.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
    depends_on: [prometheus, loki]
    mem_limit: 384m
    cpus: 0.5
    logging: *logging

  # Metrics store only: Alloy pushes to it (remote write); no scrape jobs.
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9095:9090"      # loopback only: for Alloy (host network)
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 192m
    cpus: 0.5
    logging: *logging

  # Log store, 7-day retention.
  loki:
    image: grafana/loki:3.6.20
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:3110:3100"      # loopback only: for Alloy (host network)
    volumes:
      - loki-data:/loki
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
    mem_limit: 192m
    cpus: 0.5
    logging: *logging

  # The collector: server metrics, container metrics, the login-page probe
  # and Docker logs. Host network so it can probe 127.0.0.1:8010 without
  # joining the app's network (plan 14, D-2). Read-only host access
  # (plan 14, DA-1). Not the server's existing Alloy service: this one
  # listens on 127.0.0.1:12346.
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    network_mode: host
    cgroup: host                   # see every container's cgroup (cAdvisor)
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12346
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - alloy-data:/var/lib/alloy/data
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /:/host/root:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cAdvisor's Docker support talks to containerd since Docker 29.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /run/udev/data:/run/udev/data:ro   # disk names for diskstats
    depends_on: [prometheus, loki]
    mem_limit: 160m
    cpus: 0.5
    logging: *logging

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
