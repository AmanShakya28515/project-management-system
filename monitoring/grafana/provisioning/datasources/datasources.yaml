# Grafana data sources (step 14). Fixed UIDs, so the dashboard can refer to
# them. Not editable in the UI: the repository is the source of truth.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: pms-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: pms-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
